  <script>
    (() => {
      // =========================================================
      // 1. STATE & CONFIGURATION (UNLIMITED CHARACTERS)
      // =========================================================
      const STORAGE_KEY = 'cozy_typewriter_notes_v5';

      const FONTS = [
        { name: 'Courier Prime', css: "'Courier Prime', monospace" },
        { name: 'Special Elite', css: "'Special Elite', 'Courier Prime', monospace" },
        { name: 'IBM Plex Mono', css: "'IBM Plex Mono', monospace" },
        { name: 'JetBrains Mono', css: "'JetBrains Mono', monospace" }
      ];

      const TINTS = [
        { id: 'rose', label: 'Dusty Rose' },
        { id: 'cream', label: 'Warm Cream' },
        { id: 'sage', label: 'Sage Mist' },
        { id: 'lavender', label: 'Lavender Dusk' }
      ];

      const SIZES = [
        { label: 'Classic Sheet', mobilePx: '16.5px', desktopPx: '18.5px', wide: false },
        { label: 'Wide Studio Sheet', mobilePx: '18.5px', desktopPx: '20.5px', wide: true },
        { label: 'Compact Editorial', mobilePx: '14.5px', desktopPx: '16px', wide: false }
      ];

      const DEFAULT_SAMPLE = "This App is so cool!\nWrite and save notes in best possible ways!\n\nI want you to try typing now...";

      let state = {
        notes: [],
        activeId: null,
        nightMode: true,
        warmCozy: false,
        tintIndex: 0,
        fontIndex: 0,
        sizeIndex: 0,
        sparkles: true,
        sound: true,
        rain: false,
        kbCollapsed: false,
        shift: false,
        symbols: false,
        enteredMain: false
      };

      const isDesktopLayout = () => window.innerWidth >= 768;
      const isTouchPrimary = () => window.matchMedia('(pointer: coarse)').matches && window.innerWidth < 768;

      // =========================================================
      // 2. DOM REFERENCES
      // =========================================================
      const landingScreen = document.getElementById('landingScreen');
      const btnExplore = document.getElementById('btnExplore');
      const hiddenInput = document.getElementById('hiddenInput');
      const docTitleInput = document.getElementById('docTitleInput');
      const beforeCaretEl = document.getElementById('beforeCaret');
      const selectedTextEl = document.getElementById('selectedText');
      const afterCaretEl = document.getElementById('afterCaret');
      const placeholderHint = document.getElementById('placeholderHint');
      const caretCursor = document.getElementById('caretCursor');
      const paperViewport = document.getElementById('paperViewport');
      const paperWrapper = document.getElementById('paperWrapper');
      const rollerAssembly = document.getElementById('rollerAssembly');
      const carriagePill = document.getElementById('carriagePill');
      const typebarStriker = document.getElementById('typebarStriker');
      const spotlightCone = document.getElementById('spotlightCone');
      const spotlightCore = document.getElementById('spotlightCore');
      const sparklesLayer = document.getElementById('sparklesLayer');
      const charCounter = document.getElementById('charCounter');
      const noteBadge = document.getElementById('noteBadge');
      const keyboardDeck = document.getElementById('keyboardDeck');
      const keyPopBubble = document.getElementById('keyPopBubble');
      const toastEl = document.getElementById('toast');

      // =========================================================
      // 3. WEB AUDIO API SYNTHESIZER (Tactile ASMR + Bell + Rain)
      // =========================================================
      let audioCtx = null;
      let rainNode = null;
      let rainGain = null;

      function ensureAudio() {
        if (!audioCtx) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (Ctx) audioCtx = new Ctx();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume().catch(() => {});
        }
      }

      function playKeySound(type = 'char') {
        if (!state.sound) return;
        ensureAudio();
        if (!audioCtx) return;

        const now = audioCtx.currentTime;
        const pitchJitter = 0.94 + Math.random() * 0.12;

        if (type === 'return') {
          const osc1 = audioCtx.createOscillator();
          const osc2 = audioCtx.createOscillator();
          const bellGain = audioCtx.createGain();
          osc1.type = 'sine';
          osc2.type = 'triangle';
          osc1.frequency.setValueAtTime(1865, now + 0.04);
          osc2.frequency.setValueAtTime(2794, now + 0.04);

          bellGain.gain.setValueAtTime(0.0001, now);
          bellGain.gain.linearRampToValueAtTime(0.11, now + 0.045);
          bellGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.85);

          osc1.connect(bellGain);
          osc2.connect(bellGain);
          bellGain.connect(audioCtx.destination);
          osc1.start(now + 0.04);
          osc2.start(now + 0.04);
          osc1.stop(now + 0.88);
          osc2.stop(now + 0.88);
        }

        const bufferSize = Math.floor(audioCtx.sampleRate * (type === 'space' ? 0.055 : 0.038));
        const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          const env = Math.pow(1 - i / bufferSize, 2.2);
          data[i] = (Math.random() * 2 - 1) * env;
        }

        const noise = audioCtx.createBufferSource();
        noise.buffer = noiseBuffer;

        const warmthScale = state.warmCozy ? 0.84 : 1.0;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        if (type === 'space') {
          filter.frequency.setValueAtTime(520 * pitchJitter * warmthScale, now);
          filter.Q.setValueAtTime(1.6, now);
        } else if (type === 'backspace') {
          filter.frequency.setValueAtTime(1350 * pitchJitter * warmthScale, now);
          filter.Q.setValueAtTime(2.2, now);
        } else {
          filter.frequency.setValueAtTime(1750 * pitchJitter * warmthScale, now);
          filter.Q.setValueAtTime(1.9, now);
        }

        const gain = audioCtx.createGain();
        const peak = type === 'space' ? 0.24 : 0.18;
        gain.gain.setValueAtTime(peak, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + (type === 'space' ? 0.055 : 0.038));

        const thud = audioCtx.createOscillator();
        const thudGain = audioCtx.createGain();
        thud.type = 'sine';
        thud.frequency.setValueAtTime((type === 'space' ? 115 : 165) * pitchJitter * warmthScale, now);
        thud.frequency.exponentialRampToValueAtTime(42, now + 0.032);
        thudGain.gain.setValueAtTime(type === 'space' ? 0.18 : 0.11, now);
        thudGain.gain.exponentialRampToValueAtTime(0.001, now + 0.035);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);

        thud.connect(thudGain);
        thudGain.connect(audioCtx.destination);

        noise.start(now);
        thud.start(now);
        thud.stop(now + 0.04);
      }

      function toggleRainAmbience() {
        state.rain = !state.rain;
        document.getElementById('rainStatusLabel').textContent = `Currently: ${state.rain ? 'On' : 'Off'}`;
        if (state.rain) {
          ensureAudio();
          if (!audioCtx) return;
          const bufferSize = audioCtx.sampleRate * 3;
          const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
          const out = buffer.getChannelData(0);
          let b0 = 0, b1 = 0, b2 = 0;
          for (let i = 0; i < bufferSize; i++) {
            const white = Math.random() * 2 - 1;
            b0 = 0.99765 * b0 + white * 0.099046;
            b1 = 0.96300 * b1 + white * 0.2965164;
            b2 = 0.57000 * b2 + white * 1.0526913;
            out[i] = (b0 + b1 + b2 + white * 0.1848) * 0.04;
          }
          rainNode = audioCtx.createBufferSource();
          rainNode.buffer = buffer;
          rainNode.loop = true;

          const lpf = audioCtx.createBiquadFilter();
          lpf.type = 'lowpass';
          lpf.frequency.value = 950;

          rainGain = audioCtx.createGain();
          rainGain.gain.setValueAtTime(0.001, audioCtx.currentTime);
          rainGain.gain.linearRampToValueAtTime(0.32, audioCtx.currentTime + 0.8);

          rainNode.connect(lpf);
          lpf.connect(rainGain);
          rainGain.connect(audioCtx.destination);
          rainNode.start();
          showToast('Cozy Rain On');
        } else {
          if (rainNode && rainGain && audioCtx) {
            rainGain.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + 0.35);
            const oldNode = rainNode;
            setTimeout(() => { try { oldNode.stop(); } catch (e) {} }, 400);
          }
          rainNode = null;
          showToast('Cozy Rain Off');
        }
      }

      // =========================================================
      // 4. SPRING PHYSICS ENGINE (Carriage X + T-Bar Striker)
      // =========================================================
      let targetCarriageX = 160;
      let currentCarriageX = 160;
      let carriageVelocity = 0;
      let strikerImpulse = 0;
      let paperNudgeY = 0;

      function triggerStrikerHit(isNewline = false) {
        strikerImpulse = 1;
        if (isNewline) {
          paperNudgeY = 6;
        }
      }

      function updateCarriageTarget() {
        const rollerRect = rollerAssembly.getBoundingClientRect();
        const caretRect = caretCursor.getBoundingClientRect();
        if (rollerRect.width <= 0) return;

        let relX = caretRect.left - rollerRect.left;
        const minPad = 52;
        const maxPad = rollerRect.width - 52;
        relX = Math.max(minPad, Math.min(maxPad, relX));
        targetCarriageX = relX;
      }

      let lastFrameTime = performance.now();
      function animatePhysics(now) {
        const dt = Math.min(0.032, (now - lastFrameTime) / 1000);
        lastFrameTime = now;

        const stiffness = 360;
        const damping = 28;
        const force = (targetCarriageX - currentCarriageX) * stiffness;
        carriageVelocity = (carriageVelocity + force * dt) * Math.exp(-damping * dt);
        currentCarriageX += carriageVelocity * dt;

        carriagePill.style.transform = `translate3d(${currentCarriageX.toFixed(2)}px, 0, 0)`;

        const paperRect = paperWrapper.getBoundingClientRect();
        const rollerRect = rollerAssembly.getBoundingClientRect();
        const paperOffsetX = currentCarriageX + (rollerRect.left - paperRect.left);
        spotlightCone.style.transform = `translate3d(${paperOffsetX.toFixed(2)}px, 0, 0)`;
        spotlightCore.style.transform = `translate3d(${paperOffsetX.toFixed(2)}px, 0, 0)`;

        if (strikerImpulse > 0.001) {
          strikerImpulse *= Math.exp(-26 * dt);
          const lift = -5.5 * strikerImpulse;
          const stretch = 1 + 0.14 * strikerImpulse;
          typebarStriker.style.transform = `translate3d(0, ${lift.toFixed(2)}px, 0) scaleY(${stretch.toFixed(3)})`;
        } else {
          typebarStriker.style.transform = 'translate3d(0, 0, 0) scaleY(1)';
        }

        if (Math.abs(paperNudgeY) > 0.05) {
          paperNudgeY *= Math.exp(-18 * dt);
          paperWrapper.style.transform = `translate3d(0, ${paperNudgeY.toFixed(2)}px, 0)`;
        } else {
          paperWrapper.style.transform = 'translate3d(0, 0, 0)';
        }

        requestAnimationFrame(animatePhysics);
      }
      requestAnimationFrame(animatePhysics);

      // =========================================================
      // 5. NOTES PERSISTENCE & UNLIMITED CURSOR RENDERING
      // =========================================================
      function loadNotes() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed.notes) && parsed.notes.length > 0) {
              state.notes = parsed.notes;
              state.activeId = parsed.activeId || parsed.notes[0].id;
              return;
            }
          }
        } catch (e) {}

        const initial = {
          id: 'note_' + Date.now(),
          title: 'Cozy writer',
          text: DEFAULT_SAMPLE,
          updatedAt: Date.now()
        };
        state.notes = [initial];
        state.activeId = initial.id;
      }

      function saveNotes() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            notes: state.notes,
            activeId: state.activeId
          }));
        } catch (e) {}
      }

      function getActiveNote() {
        return state.notes.find(n => n.id === state.activeId) || state.notes[0];
      }

      function syncTitleUI() {
        const note = getActiveNote();
        const titleVal = (note && note.title) ? note.title : 'Cozy writer';
        if (document.activeElement !== docTitleInput) {
          docTitleInput.value = titleVal;
        }
        document.title = titleVal;
      }

      docTitleInput.addEventListener('input', () => {
        const note = getActiveNote();
        if (note) {
          note.title = docTitleInput.value;
          note.updatedAt = Date.now();
          document.title = note.title.trim() || 'Cozy writer';
          saveNotes();
        }
      });

      docTitleInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === 'Escape') {
          e.preventDefault();
          if (!docTitleInput.value.trim()) {
            docTitleInput.value = 'Cozy writer';
            const note = getActiveNote();
            if (note) { note.title = 'Cozy writer'; saveNotes(); }
          }
          docTitleInput.blur();
          focusPhysicalInput();
        }
      });

      function updateCounter(text) {
        const len = text.length;
        const trimmed = text.trim();
        const words = trimmed ? trimmed.split(/\s+/).length : 0;
        if (isDesktopLayout()) {
          charCounter.textContent = `${words.toLocaleString()} words · ${len.toLocaleString()} chars`;
        } else {
          charCounter.textContent = `${len.toLocaleString()} chars`;
        }
      }

      function renderEditor(text, selStart, selEnd, animateStamp = false) {
        if (typeof selEnd === 'boolean') {
          animateStamp = selEnd;
          selEnd = selStart;
        }
        const rawStart = typeof selStart === 'number' ? selStart : text.length;
        const rawEnd = typeof selEnd === 'number' ? selEnd : rawStart;
        const safeStart = Math.max(0, Math.min(text.length, Math.min(rawStart, rawEnd)));
        const safeEnd = Math.max(safeStart, Math.min(text.length, Math.max(rawStart, rawEnd)));
        const hasSelection = safeEnd > safeStart;

        const note = getActiveNote();
        if (note) {
          note.text = text;
          note.updatedAt = Date.now();
          saveNotes();
        }

        if (hiddenInput.value !== text) {
          hiddenInput.value = text;
        }
        if (document.activeElement === hiddenInput) {
          if (hiddenInput.selectionStart !== safeStart || hiddenInput.selectionEnd !== safeEnd) {
            try { hiddenInput.setSelectionRange(safeStart, safeEnd); } catch (e) {}
          }
        }

        placeholderHint.style.opacity = text.length === 0 ? '1' : '0';
        updateCounter(text);
        noteBadge.textContent = `Notes (${state.notes.length})`;
        syncTitleUI();

        const beforeText = text.slice(0, safeStart);
        const selText = text.slice(safeStart, safeEnd);
        const afterText = text.slice(safeEnd);

        if (animateStamp && !hasSelection && beforeText.length > 0) {
          beforeCaretEl.textContent = beforeText.slice(0, -1);
          const stamp = document.createElement('span');
          stamp.className = 'ink-char';
          stamp.textContent = beforeText.slice(-1);
          beforeCaretEl.appendChild(stamp);
        } else {
          beforeCaretEl.textContent = beforeText;
        }
        selectedTextEl.textContent = selText;
        afterCaretEl.textContent = afterText;
        caretCursor.classList.toggle('has-selection', hasSelection);

        if (safeEnd === text.length && !hasSelection) {
          paperViewport.scrollTop = paperViewport.scrollHeight;
        }

        requestAnimationFrame(updateCarriageTarget);
      }

      function insertAtCursor(str, soundType = 'char', isNewline = false) {
        const current = getActiveNote().text;
        const pos = hiddenInput.selectionStart ?? current.length;
        const end = hiddenInput.selectionEnd ?? pos;

        const nextText = current.slice(0, pos) + str + current.slice(end);
        const nextPos = pos + str.length;
        playKeySound(soundType);
        triggerStrikerHit(isNewline);
        renderEditor(nextText, nextPos, nextPos, true);
      }

      function deleteAtCursor() {
        const current = getActiveNote().text;
        const pos = hiddenInput.selectionStart ?? current.length;
        const end = hiddenInput.selectionEnd ?? pos;

        if (end > pos) {
          const nextText = current.slice(0, pos) + current.slice(end);
          playKeySound('backspace');
          triggerStrikerHit(false);
          renderEditor(nextText, pos, pos, false);
        } else if (pos > 0) {
          const nextText = current.slice(0, pos - 1) + current.slice(pos);
          playKeySound('backspace');
          triggerStrikerHit(false);
          renderEditor(nextText, pos - 1, pos - 1, false);
        }
      }

      // =========================================================
      // 6. ADAPTIVE KEYBOARD BUILDER (Mobile Deck vs PC Mechanical Deck)
      // =========================================================
      const MOBILE_ALPHA_ROWS = [
        ['q', 'w', 'e', 'r', 't', 'y', 'u', 'i', 'o', 'p'],
        ['a', 's', 'd', 'f', 'g', 'h', 'j', 'k', 'l'],
        ['SHIFT', 'z', 'x', 'c', 'v', 'b', 'n', 'm', 'BACKSPACE'],
        ['123', 'SPACE', 'RETURN']
      ];

      const MOBILE_SYMBOL_ROWS = [
        ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0'],
        ['-', '/', ':', ';', '(', ')', '$', '&', '@', '"'],
        ['ABC', '.', ',', '?', '!', "'", '—', 'BACKSPACE'],
        ['ABC', 'SPACE', 'RETURN']
      ];

      const PC_DESKTOP_ROWS = [
        ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0', '-', '=', 'BACKSPACE'],
        ['TAB', 'q', 'w', 'e', 'r', 't', 'y', 'u', 'i', 'o', 'p', '[', ']'],
        ['a', 's', 'd', 'f', 'g', 'h', 'j', 'k', 'l', ';', "'", 'RETURN'],
        ['SHIFT', 'z', 'x', 'c', 'v', 'b', 'n', 'm', ',', '.', '/', 'SHIFT'],
        ['LEFT', 'SPACE', 'RIGHT']
      ];

      const SHIFT_MAP = {
        '1': '!', '2': '@', '3': '#', '4': '$', '5': '%',
        '6': '^', '7': '&', '8': '*', '9': '(', '0': ')',
        '-': '_', '=': '+', '[': '{', ']': '}', ';': ':',
        "'": '"', ',': '<', '.': '>', '/': '?'
      };

      let lastBuiltDesktop = null;

      function buildKeyboard(force = false) {
        const desktop = isDesktopLayout();
        if (!force && lastBuiltDesktop === desktop && keyboardDeck.children.length > 0) {
          keyboardDeck.querySelectorAll('.keycap').forEach(btn => {
            const base = btn.dataset.base;
            if (!base) return;
            if (base === 'SHIFT') {
              btn.classList.toggle('shift-active', state.shift);
            } else if (base.length === 1) {
              const ch = state.shift
                ? (SHIFT_MAP[base] || base.toUpperCase())
                : base;
              btn.textContent = ch;
              btn.dataset.key = ch;
            }
          });
          return;
        }

        lastBuiltDesktop = desktop;
        keyboardDeck.innerHTML = '';

        const rows = desktop
          ? PC_DESKTOP_ROWS
          : (state.symbols ? MOBILE_SYMBOL_ROWS : MOBILE_ALPHA_ROWS);

        rows.forEach((rowKeys, rIdx) => {
          const rowEl = document.createElement('div');
          rowEl.className = 'kb-row' + (!desktop && rIdx === 1 ? ' mobile-indent' : '');

          rowKeys.forEach((keyCode) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'keycap';
            btn.dataset.base = keyCode;

            let label = keyCode;
            let dataKey = keyCode;

            if (keyCode === 'SHIFT') {
              btn.classList.add('fn-key');
              if (state.shift) btn.classList.add('shift-active');
              label = '⇧';
            } else if (keyCode === 'BACKSPACE') {
              btn.classList.add('fn-key');
              label = '⌫';
            } else if (keyCode === 'TAB') {
              btn.classList.add('fn-key');
              label = 'tab';
            } else if (keyCode === '123' || keyCode === 'ABC') {
              btn.classList.add('fn-key');
              label = keyCode;
            } else if (keyCode === 'SPACE') {
              btn.classList.add('space-key');
              label = 'space';
            } else if (keyCode === 'RETURN') {
              btn.classList.add('return-key');
              label = '↵';
            } else if (keyCode === 'LEFT') {
              btn.classList.add('fn-key');
              label = '←';
            } else if (keyCode === 'RIGHT') {
              btn.classList.add('fn-key');
              label = '→';
            } else {
              label = state.shift ? (SHIFT_MAP[keyCode] || keyCode.toUpperCase()) : keyCode;
              dataKey = label;
            }

            btn.textContent = label;
            btn.dataset.key = dataKey;

            btn.addEventListener('pointerdown', (e) => {
              e.preventDefault();
              btn.classList.add('pressed');
              if (navigator.vibrate) {
                try { navigator.vibrate(6); } catch (_) {}
              }

              if (keyCode.length === 1 && !desktop) {
                const rect = btn.getBoundingClientRect();
                keyPopBubble.textContent = label;
                keyPopBubble.style.left = `${rect.left + rect.width / 2}px`;
                keyPopBubble.style.top = `${rect.top}px`;
                keyPopBubble.classList.add('visible');
              }

              handleVirtualKey(keyCode, btn.dataset.key);
              focusPhysicalInput();
            });

            const releaseKey = () => {
              btn.classList.remove('pressed');
              keyPopBubble.classList.remove('visible');
            };
            btn.addEventListener('pointerup', releaseKey);
            btn.addEventListener('pointerleave', releaseKey);
            btn.addEventListener('pointercancel', releaseKey);

            rowEl.appendChild(btn);
          });

          keyboardDeck.appendChild(rowEl);
        });
      }

      function handleVirtualKey(keyCode, displayLabel) {
        if (keyCode === 'SHIFT') {
          state.shift = !state.shift;
          playKeySound('backspace');
          buildKeyboard(false);
          return;
        }
        if (keyCode === '123') {
          state.symbols = true;
          playKeySound('backspace');
          buildKeyboard(true);
          return;
        }
        if (keyCode === 'ABC') {
          state.symbols = false;
          playKeySound('backspace');
          buildKeyboard(true);
          return;
        }
        if (keyCode === 'BACKSPACE') {
          deleteAtCursor();
          return;
        }
        if (keyCode === 'TAB') {
          insertAtCursor('  ', 'space', false);
          return;
        }
        if (keyCode === 'SPACE') {
          insertAtCursor(' ', 'space', false);
          return;
        }
        if (keyCode === 'RETURN') {
          insertAtCursor('\n', 'return', true);
          return;
        }
        if (keyCode === 'LEFT' || keyCode === 'RIGHT') {
          const cur = hiddenInput.selectionStart ?? getActiveNote().text.length;
          const next = keyCode === 'LEFT' ? Math.max(0, cur - 1) : Math.min(getActiveNote().text.length, cur + 1);
          playKeySound('backspace');
          renderEditor(getActiveNote().text, next, next, false);
          return;
        }

        insertAtCursor(displayLabel, 'char', false);
        if (state.shift) {
          state.shift = false;
          buildKeyboard(false);
        }
      }

      // =========================================================
      // 7. FIRST PAGE EXPLORE TRANSITION & INPUT SYNC
      // =========================================================
      function enterMainStudio() {
        if (state.enteredMain) return;
        state.enteredMain = true;
        playKeySound('return');
        landingScreen.classList.add('entering');
        setTimeout(() => {
          landingScreen.style.display = 'none';
          updateCarriageTarget();
          currentCarriageX = targetCarriageX;
          focusPhysicalInput();
        }, 560);
      }

      btnExplore.addEventListener('click', enterMainStudio);

      function focusPhysicalInput() {
        if (state.enteredMain && !isTouchPrimary() && document.activeElement !== docTitleInput) {
          hiddenInput.focus({ preventScroll: true });
        }
      }

      document.getElementById('stageArea').addEventListener('click', () => {
        if (isTouchPrimary()) {
          if (state.kbCollapsed) toggleKeyboardCollapse(false);
        } else {
          focusPhysicalInput();
        }
      });

      function syncFromHiddenSelection() {
        if (document.activeElement === hiddenInput) {
          const s = hiddenInput.selectionStart ?? hiddenInput.value.length;
          const e = hiddenInput.selectionEnd ?? s;
          renderEditor(hiddenInput.value, s, e, false);
        }
      }

      hiddenInput.addEventListener('input', () => {
        const newVal = hiddenInput.value;
        const oldVal = getActiveNote().text;
        const pos = hiddenInput.selectionStart ?? newVal.length;
        const end = hiddenInput.selectionEnd ?? pos;
        const isInsert = newVal.length >= oldVal.length;
        const insertedChar = newVal.slice(Math.max(0, pos - 1), pos);

        if (isInsert) {
          if (insertedChar === '\n') {
            playKeySound('return');
            triggerStrikerHit(true);
          } else if (insertedChar === ' ') {
            playKeySound('space');
            triggerStrikerHit(false);
          } else {
            playKeySound('char');
            triggerStrikerHit(false);
          }
        } else {
          playKeySound('backspace');
          triggerStrikerHit(false);
        }

        renderEditor(newVal, pos, end, isInsert);
      });

      ['keyup', 'mouseup', 'select'].forEach(evt => {
        hiddenInput.addEventListener(evt, syncFromHiddenSelection);
      });
      document.addEventListener('selectionchange', syncFromHiddenSelection);

      window.addEventListener('keydown', (e) => {
        // If still on the first landing page, Enter or Space triggers Explore
        if (!state.enteredMain) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            enterMainStudio();
          }
          return;
        }

        // Allow typing & Ctrl+A freely inside the editable title input at the top center
        if (document.activeElement === docTitleInput) {
          return;
        }

        if (document.getElementById('notesModal').classList.contains('open') ||
            document.getElementById('exportModal').classList.contains('open')) {
          if (e.key === 'Escape') {
            document.getElementById('notesModal').classList.remove('open');
            document.getElementById('exportModal').classList.remove('open');
            focusPhysicalInput();
          }
          return;
        }

        const isMod = e.metaKey || e.ctrlKey;

        // Ctrl+A / Cmd+A: Select All text on the typewriter sheet
        if (isMod && !e.altKey && e.key.toLowerCase() === 'a') {
          e.preventDefault();
          const currentText = getActiveNote().text;
          hiddenInput.value = currentText;
          hiddenInput.focus({ preventScroll: true });
          hiddenInput.setSelectionRange(0, currentText.length);
          renderEditor(currentText, 0, currentText.length, false);
          return;
        }

        // Desktop Shortcuts
        if (isMod && e.key.toLowerCase() === 'k') {
          e.preventDefault();
          toggleKeyboardCollapse();
          return;
        }
        if (isMod && e.key.toLowerCase() === 'l') {
          e.preventDefault();
          document.getElementById('btnLampMode').click();
          return;
        }

        if (!isTouchPrimary() && document.activeElement !== hiddenInput) {
          hiddenInput.focus({ preventScroll: true });
        }

        // Escape collapses any active selection cleanly
        if (e.key === 'Escape') {
          const endPos = hiddenInput.selectionEnd ?? getActiveNote().text.length;
          hiddenInput.setSelectionRange(endPos, endPos);
          renderEditor(getActiveNote().text, endPos, endPos, false);
          return;
        }

        if (e.key === 'Tab') {
          e.preventDefault();
          insertAtCursor('  ', 'space', false);
        }

        if (isMod) return;

        let targetKey = e.key;
        if (targetKey === ' ') targetKey = 'SPACE';
        else if (targetKey === 'Enter') targetKey = 'RETURN';
        else if (targetKey === 'Backspace') targetKey = 'BACKSPACE';
        else if (targetKey === 'Shift') targetKey = 'SHIFT';
        else if (targetKey === 'Tab') targetKey = 'TAB';
        else if (targetKey === 'ArrowLeft') targetKey = 'LEFT';
        else if (targetKey === 'ArrowRight') targetKey = 'RIGHT';

        keyboardDeck.querySelectorAll('.keycap').forEach(el => {
          if (el.dataset.base === targetKey ||
              el.dataset.key === targetKey ||
              el.dataset.base?.toLowerCase() === targetKey.toLowerCase()) {
            el.classList.add('pressed');
          }
        });
      });

      window.addEventListener('keyup', (e) => {
        let targetKey = e.key;
        if (targetKey === ' ') targetKey = 'SPACE';
        else if (targetKey === 'Enter') targetKey = 'RETURN';
        else if (targetKey === 'Backspace') targetKey = 'BACKSPACE';
        else if (targetKey === 'Shift') targetKey = 'SHIFT';
        else if (targetKey === 'Tab') targetKey = 'TAB';
        else if (targetKey === 'ArrowLeft') targetKey = 'LEFT';
        else if (targetKey === 'ArrowRight') targetKey = 'RIGHT';

        keyboardDeck.querySelectorAll('.keycap').forEach(el => {
          if (el.dataset.base === targetKey ||
              el.dataset.key === targetKey ||
              el.dataset.base?.toLowerCase() === targetKey.toLowerCase()) {
            el.classList.remove('pressed');
          }
        });
      });

      // =========================================================
      // 8. FLOATING TOOLBAR CONTROLS & MODALS
      // =========================================================
      let toastTimer = null;
      function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1700);
      }

      function toggleKeyboardCollapse(forceState) {
        state.kbCollapsed = typeof forceState === 'boolean' ? forceState : !state.kbCollapsed;
        keyboardDeck.classList.toggle('collapsed', state.kbCollapsed);
        const chevron = document.getElementById('chevronIcon');
        chevron.style.transform = state.kbCollapsed ? 'rotate(180deg)' : 'rotate(0deg)';
        chevron.style.transition = 'transform 0.3s ease';
        setTimeout(updateCarriageTarget, 390);
      }

      function applySizeScale() {
        const sz = SIZES[state.sizeIndex];
        const px = isDesktopLayout() ? sz.desktopPx : sz.mobilePx;
        document.documentElement.style.setProperty('--font-size', px);
        document.body.classList.toggle('wide-paper', sz.wide);
      }

      document.getElementById('btnToggleKb').addEventListener('click', () => {
        toggleKeyboardCollapse();
        focusPhysicalInput();
      });

      document.getElementById('btnPaperTint').addEventListener('click', () => {
        state.tintIndex = (state.tintIndex + 1) % TINTS.length;
        const tint = TINTS[state.tintIndex];
        document.body.setAttribute('data-tint', tint.id);
        if (state.nightMode) {
          state.nightMode = false;
          state.warmCozy = false;
          document.body.classList.remove('night-mode', 'warm-cozy');
          const lampBtn = document.getElementById('btnLampMode');
          lampBtn.classList.remove('is-active', 'warm-active');
        }
        playKeySound('backspace');
        showToast(`Day Paper: ${tint.label}`);
        focusPhysicalInput();
      });

      document.getElementById('btnFontCycle').addEventListener('click', () => {
        state.fontIndex = (state.fontIndex + 1) % FONTS.length;
        const font = FONTS[state.fontIndex];
        document.documentElement.style.setProperty('--font-typewriter', font.css);
        playKeySound('backspace');
        showToast(`Font: ${font.name}`);
        requestAnimationFrame(updateCarriageTarget);
        focusPhysicalInput();
      });

      document.getElementById('btnSparkles').addEventListener('click', (e) => {
        state.sparkles = !state.sparkles;
        sparklesLayer.classList.toggle('hidden', !state.sparkles);
        e.currentTarget.classList.toggle('is-active', state.sparkles);
        playKeySound('backspace');
        showToast(state.sparkles ? 'Sparkles On' : 'Sparkles Off');
        focusPhysicalInput();
      });

      document.getElementById('btnZoomSize').addEventListener('click', () => {
        state.sizeIndex = (state.sizeIndex + 1) % SIZES.length;
        applySizeScale();
        playKeySound('backspace');
        showToast(SIZES[state.sizeIndex].label);
        setTimeout(updateCarriageTarget, 320);
        focusPhysicalInput();
      });

      document.getElementById('btnLampMode').addEventListener('click', (e) => {
        if (!state.nightMode) {
          state.nightMode = true;
          state.warmCozy = false;
        } else {
          state.warmCozy = !state.warmCozy;
        }
        document.body.classList.toggle('night-mode', state.nightMode);
        document.body.classList.toggle('warm-cozy', state.nightMode && state.warmCozy);
        e.currentTarget.classList.toggle('is-active', state.nightMode);
        e.currentTarget.classList.toggle('warm-active', state.nightMode && state.warmCozy);
        playKeySound('backspace');
        showToast(state.warmCozy ? 'Warm Cozy Mood' : 'Normal Mood');
        focusPhysicalInput();
      });

      document.getElementById('btnSoundToggle').addEventListener('click', (e) => {
        state.sound = !state.sound;
        e.currentTarget.classList.toggle('sound-on', state.sound);
        if (state.sound) playKeySound('char');
        showToast(state.sound ? 'Key Sound On' : 'Muted');
        focusPhysicalInput();
      });

      // =========================================================
      // 9. SAVED NOTES DRAWER & EXPORT PNG/TXT
      // =========================================================
      const notesModal = document.getElementById('notesModal');
      const exportModal = document.getElementById('exportModal');

      function createFreshSheet() {
        const pageNum = state.notes.length + 1;
        const newNote = {
          id: 'note_' + Date.now(),
          title: `Page ${pageNum}`,
          text: '',
          updatedAt: Date.now()
        };
        state.notes.unshift(newNote);
        state.activeId = newNote.id;
        playKeySound('return');
        renderEditor('', 0, 0, false);
        notesModal.classList.remove('open');
        showToast('Fresh Paper Loaded');
        focusPhysicalInput();
      }

      function renderNotesList() {
        const listEl = document.getElementById('notesList');
        listEl.innerHTML = '';
        state.notes.forEach((n) => {
          const item = document.createElement('div');
          item.className = 'note-item' + (n.id === state.activeId ? ' active-note' : '');
          const heading = (n.title && n.title.trim()) || (n.text || '').trim().split('\n')[0] || 'Blank sheet...';
          const dateStr = new Date(n.updatedAt).toLocaleDateString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });

          item.innerHTML = `
            <div>
              <div class="note-preview">${escapeHtml(heading)}</div>
              <div class="note-meta">${dateStr} · ${n.text.length.toLocaleString()} chars</div>
            </div>
          `;

          if (state.notes.length > 1) {
            const delBtn = document.createElement('button');
            delBtn.className = 'delete-note-btn';
            delBtn.textContent = 'Delete';
            delBtn.addEventListener('click', (e) => {
              e.stopPropagation();
              state.notes = state.notes.filter(x => x.id !== n.id);
              if (state.activeId === n.id) {
                state.activeId = state.notes[0].id;
                renderEditor(state.notes[0].text, state.notes[0].text.length, state.notes[0].text.length, false);
              }
              saveNotes();
              renderNotesList();
            });
            item.appendChild(delBtn);
          }

          item.addEventListener('click', () => {
            state.activeId = n.id;
            renderEditor(n.text, n.text.length, n.text.length, false);
            saveNotes();
            notesModal.classList.remove('open');
            focusPhysicalInput();
          });

          listEl.appendChild(item);
        });
      }

      function escapeHtml(str) {
        return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
      }

      document.getElementById('btnNotesDrawer').addEventListener('click', () => {
        renderNotesList();
        notesModal.classList.add('open');
      });
      noteBadge.addEventListener('click', () => {
        renderNotesList();
        notesModal.classList.add('open');
      });
      document.getElementById('btnPcNewSheet').addEventListener('click', createFreshSheet);
      document.getElementById('btnNewNote').addEventListener('click', createFreshSheet);

      document.getElementById('closeNotesModal').addEventListener('click', () => notesModal.classList.remove('open'));
      notesModal.addEventListener('click', (e) => { if (e.target === notesModal) notesModal.classList.remove('open'); });

      document.getElementById('btnExportModal').addEventListener('click', () => exportModal.classList.add('open'));
      document.getElementById('closeExportModal').addEventListener('click', () => exportModal.classList.remove('open'));
      exportModal.addEventListener('click', (e) => { if (e.target === exportModal) exportModal.classList.remove('open'); });

      document.getElementById('btnRainToggle').addEventListener('click', toggleRainAmbience);

      document.getElementById('btnCopyText').addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(getActiveNote().text);
          showToast('Copied to Clipboard');
        } catch (e) {
          showToast('Copy Ready');
        }
        exportModal.classList.remove('open');
      });

      document.getElementById('btnDownloadTxt').addEventListener('click', () => {
        const note = getActiveNote();
        const slug = (note.title || 'cozy-writer').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'note';
        const blob = new Blob([note.text], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${slug}.txt`;
        a.click();
        URL.revokeObjectURL(url);
        exportModal.classList.remove('open');
        showToast('Downloaded .TXT');
      });

      document.getElementById('btnDownloadPng').addEventListener('click', () => {
        const note = getActiveNote();
        const slug = (note.title || 'cozy-writer').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'note';
        const canvas = document.createElement('canvas');
        const scale = 2;
        const W = 760;
        const H = 960;
        canvas.width = W * scale;
        canvas.height = H * scale;
        const ctx = canvas.getContext('2d');
        ctx.scale(scale, scale);

        ctx.fillStyle = state.nightMode ? (state.warmCozy ? '#140d09' : '#110d10') : '#1b1619';
        ctx.fillRect(0, 0, W, H);

        const px = 64, py = 74, pw = W - 128, ph = H - 148, r = 54;
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(px + r, py);
        ctx.lineTo(px + pw - r, py);
        ctx.quadraticCurveTo(px + pw, py, px + pw, py + r);
        ctx.lineTo(px + pw, py + ph);
        ctx.lineTo(px, py + ph);
        ctx.lineTo(px, py + r);
        ctx.quadraticCurveTo(px, py, px + r, py);
        ctx.closePath();

        const cs = getComputedStyle(document.body);
        ctx.fillStyle = cs.getPropertyValue('--paper-bg').trim() || '#ebd2de';
        ctx.fill();
        ctx.clip();

        if (state.nightMode) {
          const grad = ctx.createRadialGradient(W * 0.56, py + ph - 40, 20, W * 0.52, py + ph * 0.48, 420);
          if (state.warmCozy) {
            grad.addColorStop(0, 'rgba(255, 226, 178, 0.78)');
            grad.addColorStop(0.55, 'rgba(255, 176, 92, 0.28)');
            grad.addColorStop(1, 'rgba(22, 13, 8, 0)');
          } else {
            grad.addColorStop(0, 'rgba(255, 232, 240, 0.72)');
            grad.addColorStop(0.55, 'rgba(255, 198, 218, 0.24)');
            grad.addColorStop(1, 'rgba(20, 14, 18, 0)');
          }
          ctx.fillStyle = grad;
          ctx.fillRect(px, py, pw, ph);
        }

        ctx.fillStyle = state.nightMode ? 'rgba(15,10,12,0.22)' : 'rgba(60,40,50,0.14)';
        for (let i = 0; i < 160; i++) {
          const sx = px + ((i * 73) % pw);
          const sy = py + ((i * 137) % ph);
          ctx.beginPath();
          ctx.arc(sx, sy, (i % 3) * 0.45 + 0.6, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.fillStyle = state.nightMode ? (state.warmCozy ? '#ffedd4' : '#f7e5ed') : '#2b1e25';
        ctx.font = `400 26px ${FONTS[state.fontIndex].css}`;
        const rawText = note.text || note.title || 'Cozy writer';
        const maxTextW = pw - 110;
        const paragraphs = rawText.split('\n');
        let cursorY = py + 105;
        const lineH = 42;

        paragraphs.forEach(para => {
          const words = para.split(' ');
          let line = '';
          words.forEach(word => {
            const test = line ? line + ' ' + word : word;
            if (ctx.measureText(test).width > maxTextW && line) {
              ctx.fillText(line, px + 55, cursorY);
              cursorY += lineH;
              line = word;
            } else {
              line = test;
            }
          });
          ctx.fillText(line, px + 55, cursorY);
          cursorY += lineH;
        });

        ctx.restore();

        ctx.fillStyle = '#231d20';
        ctx.fillRect(px - 14, py + ph - 12, pw + 28, 14);
        ctx.fillStyle = state.nightMode ? (state.warmCozy ? '#5c4130' : '#4a3d44') : '#e6cad8';
        ctx.beginPath();
        ctx.roundRect(W * 0.56 - 52, py + ph - 20, 104, 30, 15);
        ctx.fill();

        const link = document.createElement('a');
        link.download = `${slug}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();

        exportModal.classList.remove('open');
        showToast('Saved PNG Card');
      });

      // =========================================================
      // 10. INITIALIZATION & RESPONSIVE RESIZE SYNC
      // =========================================================
      window.addEventListener('resize', () => {
        applySizeScale();
        buildKeyboard(false);
        updateCounter(getActiveNote().text);
        requestAnimationFrame(updateCarriageTarget);
      });

      loadNotes();
      applySizeScale();
      buildKeyboard(true);
      const initialText = getActiveNote().text;
      renderEditor(initialText, initialText.length, initialText.length, false);
      setTimeout(() => {
        updateCarriageTarget();
        currentCarriageX = targetCarriageX;
      }, 80);
    })();
  </script>
</body>
